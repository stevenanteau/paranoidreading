<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiction · Paranoid Reading</title>
<!--pr-meta--><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="canonical" href="https://paranoidreading.com/novels/"><meta property="og:site_name" content="Paranoid Reading"><meta property="og:type" content="website"><meta property="og:title" content="Fiction · Paranoid Reading"><meta property="og:description" content="Fiction is how the deep event gets conceived before it gets documented. Paranoid novels, noir, weird fiction, dystopias, the modernists and the poets."><meta property="og:url" content="https://paranoidreading.com/novels/"><meta property="og:image" content="https://paranoidreading.com/img/og-card.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Paranoid Reading: A reading list for the parapolitical, the paranoid and the Marxist."><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Fiction · Paranoid Reading"><meta name="twitter:description" content="Fiction is how the deep event gets conceived before it gets documented. Paranoid novels, noir, weird fiction, dystopias, the modernists and the poets."><meta name="twitter:image" content="https://paranoidreading.com/img/og-card.png"><!--/pr-meta-->
<meta name="description" content="Fiction is how the deep event gets conceived before it gets documented. Paranoid novels, noir, weird fiction, dystopias, the modernists and the poets.">
<style>
:root{color-scheme:dark;--red:var(--c-d7263d,#d7263d);--ink:var(--c-e6e1d3,#e6e1d3);--ink2:var(--c-c9c3b3,#c9c3b3);--gray:var(--c-8e897d,#8e897d);--faint:var(--c-5c584f,#5c584f);--line:var(--c-3d3a33,#3d3a33);--bg:var(--c-0b0b0a,#0b0b0a);--hov:var(--c-141412,#141412)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--red)}
.x-main{max-width:1080px;margin:0 auto;padding:30px 40px 80px}
.x-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--red);margin:0 0 6px}
.x-lede{font-size:18px;line-height:1.5;color:var(--c-d4cebf,#d4cebf);max-width:720px;margin:0 0 6px}
.x-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){.x-main{padding:20px 16px 60px}.x-lede{font-size:16px}}

.x-head{border-bottom:1px solid var(--ink);padding-bottom:16px;margin-bottom:22px}
.x-head h1{font-size:clamp(38px,7vw,64px);margin:4px 0 12px}
.x-filters{border:1px solid var(--line);padding:16px 16px 12px;margin-bottom:18px;display:grid;grid-template-columns:repeat(12,1fr);gap:12px 14px}
.x-f{display:flex;flex-direction:column;gap:5px;min-width:0}
.x-f>label,.x-f>.x-lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gray)}
.x-f input,.x-f select{width:100%;font:inherit;font-size:14px;padding:8px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);min-width:0}
.x-f.q{grid-column:span 6}.x-f.a{grid-column:span 6}
.x-f.y{grid-column:span 4}.x-f.kw{grid-column:span 5}.x-f.pl{grid-column:span 3}
.x-f.s3{grid-column:span 3}.x-f.s4{grid-column:span 4}
.x-yr{display:flex;align-items:center;gap:8px}.x-yr input{width:50%}.x-yr span{color:var(--faint);font-size:12px}
.x-eras{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.x-era,.x-btn{font:600 11px/1 "Inter Tight",sans-serif;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--gray);border:1px solid var(--line);padding:7px 10px;cursor:pointer}
.x-era:hover,.x-btn:hover{color:var(--ink);border-color:var(--gray)}
.x-era.on{color:var(--bg);background:var(--red);border-color:var(--red)}
.x-btn.red{color:var(--red);border-color:var(--red)}
.x-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.x-count{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--gray)}
.x-count b{color:var(--ink)}
.x-active{display:flex;flex-wrap:wrap;gap:6px}
.x-pill{font:600 10.5px/1 "Inter Tight",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border:1px solid var(--red);background:transparent;padding:6px 8px;cursor:pointer}
.x-pill::after{content:" ×";color:var(--red)}
.x-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.x-entry{border:1px solid var(--line);padding:16px 18px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.x-entry:hover{border-color:var(--gray)}
.x-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gray)}
.x-top .x-k{color:var(--red)}
.x-yrb{font-size:13px;color:var(--ink);letter-spacing:.04em}
.x-title{font-size:19px;line-height:1.15;font-weight:800;letter-spacing:-.015em;margin:2px 0 0;color:var(--ink);overflow-wrap:anywhere}
.x-by{font-size:14px;color:var(--ink2)}
.x-by button{all:unset;cursor:pointer;border-bottom:1px dotted var(--faint)}
.x-by button:hover{color:var(--red);border-color:var(--red)}
.x-sum{font-size:14.5px;line-height:1.55;color:var(--ink2);margin:4px 0 2px}
.x-sum.pend{color:var(--faint);font-style:italic}
.x-meta{font-size:12px;color:var(--gray)}
.x-meta b{font-weight:600;color:var(--ink2)}
.x-kws{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:2px}
.x-kws button{all:unset;cursor:pointer;font:600 10.5px/1.4 "Inter Tight",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
.x-kws button::before{content:"› ";color:var(--red)}
.x-kws button:hover{color:var(--ink)}
.x-pls{display:flex;flex-direction:column;gap:5px;margin:4px 0 2px;padding:8px 0 2px;border-top:1px dashed var(--line)}
.x-plrow{display:flex;align-items:baseline;gap:8px;min-width:0}
.x-pl{flex:0 0 auto;font:800 10px/1 "Inter Tight",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--red);border:0;padding:5px 7px;cursor:pointer;transform:rotate(-1.5deg)}
.x-pl:hover,.x-pl:focus-visible{background:var(--ink)}
.x-pld{font-size:12px;color:var(--gray);line-height:1.4;min-width:0;overflow-wrap:anywhere}
.x-note{font-size:13px;color:var(--ink2);border-left:2px solid var(--red);padding:2px 0 2px 10px;margin-top:4px}
.x-note summary{cursor:pointer;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gray)}
.x-note p{margin:6px 0 2px}
.x-link{font:800 11px/1 "Inter Tight",sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;margin-top:4px;align-self:flex-start}
.x-link:hover{text-decoration:underline}
.x-pickwrap{border:2px solid var(--red);padding:12px 14px 14px;margin:0 0 18px}
.x-more{display:flex;justify-content:center;margin:22px 0 0}
.x-empty{border:1px dashed var(--line);padding:30px;text-align:center;color:var(--gray)}
@media(max-width:900px){.x-list{grid-template-columns:1fr}}
@media(max-width:760px){.x-filters{grid-template-columns:1fr 1fr;padding:12px}.x-f.q,.x-f.a,.x-f.y,.x-f.kw{grid-column:1/-1}.x-f.s3,.x-f.s4{grid-column:span 1}}
</style>
<!--pr-shell--><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,800;0,900;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/pr-theme.css"><link rel="stylesheet" href="/assets/pr-shell.css"><style>:root{--file:"PR/0021"}</style><!--/pr-shell-->
</head>
<body><script src="/assets/pr-shell.js"></script>
<main class="x-main">
  <div class="x-head">
    <p class="x-eyebrow">Exhibit A · Novels, stories, poetry, drama and graphic novels</p>
    <h1>Fiction</h1>
    <p class="x-lede">Fiction is how the deep event gets conceived before it gets documented. Paranoid novels, noir, weird fiction, dystopias, the modernists and the poets.</p>
  </div>
  <form class="x-filters" id="filters" onsubmit="return false" role="search" aria-label="Filter Fiction">
    <div class="x-f q"><label for="fQ">Search</label><input id="fQ" type="search" placeholder="Title, summary, keyword…" autocomplete="off"></div>
    <div class="x-f a"><label for="fA">Author</label><input id="fA" type="search" list="dlPeople" placeholder="Any author" autocomplete="off"><datalist id="dlPeople"></datalist></div>
    <div class="x-f y"><span class="x-lab">Year</span><div class="x-yr"><label class="x-sr" for="yFrom">From year</label><input id="yFrom" type="number" inputmode="numeric" min="-3000" max="2100"><span>to</span><label class="x-sr" for="yTo">To year</label><input id="yTo" type="number" inputmode="numeric" min="-3000" max="2100"></div></div>
    <div class="x-f kw"><label for="fKw">Keyword</label><select id="fKw"></select></div>
    <div class="x-f pl" id="wPl"><label for="fPl">Reading list</label><select id="fPl"></select></div>
    <div class="x-f s3"><label for="fKind">Type</label><select id="fKind"></select></div>
    <div class="x-f s3" id="wGrade"><label for="fGrade">Evidence</label><select id="fGrade"></select></div>
    <div class="x-f s3" id="wCountry"><label for="fCountry">Country</label><select id="fCountry"></select></div>
    <div class="x-f s3"><label for="fSort">Sort</label><select id="fSort"><option value="title">Title, A to Z</option><option value="author">Author, A to Z</option><option value="old">Year, oldest first</option><option value="new">Year, newest first</option></select></div>
    <div class="x-eras" id="eras" aria-label="Year presets"></div>
  </form>
  <div class="x-bar"><span class="x-count" id="count" aria-live="polite"><span style="color:var(--gray)">Opening the files…</span></span><div class="x-active" id="active"></div><span style="display:flex;gap:8px"><button type="button" class="x-btn red" id="rnd">Random pick from these</button><button type="button" class="x-btn" id="reset">Clear all</button></span></div>
  <div id="pick"></div>
  <div class="x-list" id="list"></div>
  <div class="x-more" id="more"><button type="button" class="x-btn red" id="moreBtn">Show more</button></div>
</main>
<script>
const SEC = {"creator": "Author", "unit": "entries", "key": "novel"};
prData().then(function (J) {
const DATA = J.entries.filter(e => e.x === SEC.key);

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const people = e => String(e.by || '').replace(/^(Dir\.|Directed by|Created by|Written by)\s*/i, '')
  .split(/\.\s*(?:Written by|Dir\.)\s*|\s+and\s+|\s*&\s*|,\s*|;\s*/).map(s => s.replace(/\s*\((eds?|ed)\.\)\s*$/,'').trim()).filter(s => s && s.length > 1 && !/^et al\.?$/i.test(s) && !/^others$/i.test(s));
DATA.forEach((e, i) => { e._i = i; e._p = people(e); e._h = norm([e.t, e.by, e.s, e.src, e.k, e.c, e.g, (e.kw||[]).join(' '), e.note, (e.pl||[]).map(p => p.n + ' ' + p.d).join(' ')].join(' ')); });
const YEARS = DATA.map(e => e.y).filter(Boolean), YMIN = Math.min(...YEARS), YMAX = Math.max(new Date().getFullYear(), ...YEARS);
const NOW = new Date().getFullYear();
const yr = y => y == null ? 'n.d.' : (y < 0 ? (-y) + ' BCE' : (y < 1000 ? 'c. ' + y : y));
const ERAS = [['Any', '', ''], ['Before 1945', '', 1944], ['1945 to 1991', 1945, 1991], ['1992 to 2000', 1992, 2000], ['Since 2001', 2001, ''], ['Last ten years', NOW - 9, '']];
function opts(sel, values, all) {
  sel.innerHTML = '<option value="">' + all + '</option>' + values.map(([v, n]) => '<option value="' + esc(v) + '">' + esc(v) + (n != null ? ' (' + n + ')' : '') + '</option>').join('');
}
function counted(fn) {
  const m = new Map(); DATA.forEach(e => [].concat(fn(e) || []).forEach(v => v && m.set(v, (m.get(v) || 0) + 1)));
  return [...m.entries()];
}
opts($('fKw'), counted(e => e.kw).sort((a, b) => a[0].localeCompare(b[0])), 'All keywords');
const lists = counted(e => (e.pl || []).map(p => p.n)).sort((a, b) => b[1] - a[1]);
if (lists.length) opts($('fPl'), lists, 'Any list'); else $('wPl').style.display = 'none';
opts($('fKind'), counted(e => e.k).sort((a, b) => b[1] - a[1]), 'All types');
const grades = counted(e => e.g).sort((a, b) => b[1] - a[1]);
if (grades.length > 1) opts($('fGrade'), grades, 'Any evidence'); else $('wGrade').style.display = 'none';
const countries = counted(e => e.c ? e.c.split(' / ') : null).sort((a, b) => b[1] - a[1]);
if (countries.length > 1) opts($('fCountry'), countries, 'Any country'); else $('wCountry').style.display = 'none';
const ppl = counted(e => e._p).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
$('dlPeople').innerHTML = ppl.map(([p]) => '<option value="' + esc(p) + '">').join('');
$('yFrom').placeholder = YMIN; $('yTo').placeholder = YMAX;
$('eras').innerHTML = ERAS.map((e, i) => '<button type="button" class="x-era" data-era="' + i + '">' + e[0] + '</button>').join('');

const F = ['q', 'a', 'y0', 'y1', 'kw', 'pl', 'k', 'g', 'c', 'sort'];
const EL = {q: 'fQ', a: 'fA', y0: 'yFrom', y1: 'yTo', kw: 'fKw', pl: 'fPl', k: 'fKind', g: 'fGrade', c: 'fCountry', sort: 'fSort'};
const LBL = {q: 'Search', a: SEC.creator, y0: 'From', y1: 'To', kw: 'Keyword', pl: 'Reading list', k: 'Type', g: 'Evidence', c: 'Country'};
let SHOWN = 50, ONLY = null;
function state() { const s = {}; F.forEach(f => s[f] = $(EL[f]).value.trim()); return s; }
function setState(s) { F.forEach(f => { if (s[f] != null) $(EL[f]).value = s[f]; }); }
function filtered() {
  const s = state(), toks = norm(s.q).split(/\s+/).filter(Boolean), a = norm(s.a);
  const y0 = parseInt(s.y0) || null, y1 = parseInt(s.y1) || null;
  let r = ONLY ? DATA.filter(e => e.id === ONLY) : DATA.filter(e =>
    toks.every(t => e._h.includes(t)) &&
    (!a || norm(e.by).includes(a)) &&
    (!y0 || (e.y && e.y >= y0)) && (!y1 || (e.y && e.y <= y1)) &&
    (!s.kw || (e.kw || []).includes(s.kw)) && (!s.k || e.k === s.k) && (!s.g || e.g === s.g) &&
    (!s.c || (e.c || '').split(' / ').includes(s.c)) && (!s.pl || (e.pl || []).some(p => p.n === s.pl)));
  const tk = e => norm(e.t).replace(/^(the|a|an) /, '');
  const ak = e => norm(e._p[0] || e.by || '~').split(' ').slice(-1)[0];
  const by = {
    title: (x, y) => tk(x).localeCompare(tk(y)),
    old: (x, y) => (x.y || 9999) - (y.y || 9999) || tk(x).localeCompare(tk(y)),
    new: (x, y) => (y.y || 0) - (x.y || 0) || tk(x).localeCompare(tk(y)),
    author: (x, y) => ak(x).localeCompare(ak(y)) || (x.y || 0) - (y.y || 0)
  }[s.sort || 'title'];
  return r.sort(by);
}
function card(e) {
  const by = e.by ? '<div class="x-by">' + (e._p.length ? esc(e.by).replace(/^(Dir\.|Created by)\s*/, m => '<span style="color:var(--gray)">' + m + '</span>') : esc(e.by)) + '</div>' : '';
  const byHtml = e.by ? '<div class="x-by">' + (/^(Dir\.|Created by)/.test(e.by) ? '<span style="color:var(--gray)">' + esc(e.by.match(/^(Dir\.|Created by)/)[0]) + '</span> ' : '') +
    e._p.map(p => '<button type="button" data-person="' + esc(p) + '" title="Show all by ' + esc(p) + '">' + esc(p) + '</button>').join(', ') + '</div>' : '';
  const meta = [];
  if (e.src) meta.push(esc(e.src));
  if (e.c) meta.push(esc(e.c));
  if (e.g && e.g !== 'Fiction') meta.push('Evidence: <b>' + esc(e.g) + '</b>');
  return '<article class="x-entry">' +
    '<div class="x-top"><span class="x-k">' + esc(e.k) + '</span><span class="x-yrb">' + yr(e.y) + '</span></div>' +
    '<h3 class="x-title">' + esc(e.t) + '</h3>' + (e._p.length ? byHtml : by) +
    '<p class="x-sum' + (e.pending ? ' pend' : '') + '">' + esc(e.s) + '</p>' +
    (meta.length ? '<div class="x-meta">' + meta.join(' · ') + '</div>' : '') +
    (e.pl && e.pl.length ? '<div class="x-pls">' + e.pl.map(p => '<div class="x-plrow"><button type="button" class="x-pl" data-pl="' + esc(p.n) + '" title="Show everything on the ' + esc(p.n) + ' list">' + esc(p.n) + '</button>' + (p.d ? '<span class="x-pld">' + esc(p.d) + '</span>' : '') + '</div>').join('') + '</div>' : '') +
    (e.kw && e.kw.length ? '<div class="x-kws">' + e.kw.map(k => '<button type="button" data-kw="' + esc(k) + '">' + esc(k) + '</button>').join('') + '</div>' : '') +
    (e.note ? '<details class="x-note"><summary>Reader\'s note</summary><p>' + esc(e.note) + '</p></details>' : '') +
    (e.url ? '<a class="x-link" href="' + esc(e.url) + '" target="_blank" rel="noopener">Open source ↗</a>' : '') +
    '</article>';
}
function render() {
  const r = filtered(), s = state();
  $('count').innerHTML = '<b>' + r.length + '</b> of ' + DATA.length + ' ' + SEC.unit;
  $('list').innerHTML = r.length ? r.slice(0, SHOWN).map(card).join('') : '<div class="x-empty" style="grid-column:1/-1">Nothing matches those filters. <button type="button" class="x-btn red" data-reset>Clear filters</button></div>';
  $('more').style.display = r.length > SHOWN ? '' : 'none';
  $('moreBtn').textContent = 'Show ' + Math.min(50, r.length - SHOWN) + ' more';
  $('active').innerHTML = (ONLY ? '<button type="button" class="x-pill" data-only>One entry shown · show all ' + DATA.length + '</button>' : '') + F.filter(f => f !== 'sort' && s[f]).map(f => '<button type="button" class="x-pill" data-clear="' + f + '">' + LBL[f] + ': ' + esc(s[f]) + '</button>').join('');
  document.querySelectorAll('.x-era').forEach((b, i) => b.classList.toggle('on', String(ERAS[i][1]) === s.y0 && String(ERAS[i][2]) === s.y1));
  const q = new URLSearchParams(); F.forEach(f => s[f] && q.set(f, s[f]));
  const h = ONLY ? 'id=' + encodeURIComponent(ONLY) : q.toString(); history.replaceState(null, '', h ? '#' + h : location.pathname);
}
let t; function go(now) { SHOWN = 50; ONLY = null; clearTimeout(t); if (now) render(); else t = setTimeout(render, 140); }
['fQ', 'fA', 'yFrom', 'yTo'].forEach(id => $(id).addEventListener('input', () => go()));
['fKw', 'fPl', 'fKind', 'fGrade', 'fCountry', 'fSort'].forEach(id => $(id).addEventListener('change', () => go(true)));
$('moreBtn').addEventListener('click', () => { SHOWN += 50; render(); });
$('rnd').addEventListener('click', () => { const r = filtered().filter(e => !e.pending); if (!r.length) return; const e = r[Math.floor(Math.random() * r.length)];
  $('pick').innerHTML = '<div class="x-pickwrap"><p class="x-eyebrow">Random pick from ' + r.length + ' entries</p><div class="x-list" style="grid-template-columns:1fr">' + card(e) + '</div></div>'; $('pick').scrollIntoView({behavior: 'smooth', block: 'nearest'}); });
$('reset').addEventListener('click', reset);
function reset() { F.forEach(f => $(EL[f]).value = f === 'sort' ? 'title' : ''); go(true); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-kw],[data-pl],[data-person],[data-era],[data-clear],[data-reset],[data-only]'); if (!b) return;
  if (b.hasAttribute('data-only')) { reset(); return; }
  if (b.dataset.kw) { $('fKw').value = b.dataset.kw; }
  else if (b.dataset.pl) { $('fPl').value = b.dataset.pl; }
  else if (b.dataset.person) { $('fA').value = b.dataset.person; }
  else if (b.dataset.era != null) { const er = ERAS[+b.dataset.era]; $('yFrom').value = er[1]; $('yTo').value = er[2]; }
  else if (b.dataset.clear) { $(EL[b.dataset.clear]).value = ''; }
  else if (b.hasAttribute('data-reset')) { reset(); return; }
  go(true);
  if (b.dataset.kw || b.dataset.pl || b.dataset.person) $('filters').scrollIntoView({behavior: 'smooth', block: 'start'});
});
{ const H = Object.fromEntries(new URLSearchParams(location.hash.slice(1))); if (H.id && DATA.some(e => e.id === H.id)) ONLY = H.id; else setState(H); }
if (!$('fSort').value) $('fSort').value = 'title';
render();

}).catch(function () { document.getElementById('count').textContent = 'The files could not be loaded. Reload the page to try again.'; });
</script>
</body>
</html>
