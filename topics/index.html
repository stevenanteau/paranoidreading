<html lang="en">
<head>

<title>The Index · Paranoid Reading</title>
<!--pr-meta--><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="canonical" href="https://paranoidreading.com/topics/"><meta property="og:site_name" content="Paranoid Reading"><meta property="og:type" content="website"><meta property="og:title" content="The Index · Paranoid Reading"><meta property="og:description" content="Every Paranoid Reading entry in one index, browsable by topic: fiction, film and TV, non-fiction and articles on parapolitics, fascism, covert power and the Marxist record."><meta property="og:url" content="https://paranoidreading.com/topics/"><meta property="og:image" content="https://paranoidreading.com/img/og-card.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Paranoid Reading: A reading list for the parapolitical, the paranoid and the Marxist."><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="The Index · Paranoid Reading"><meta name="twitter:description" content="Every Paranoid Reading entry in one index, browsable by topic: fiction, film and TV, non-fiction and articles on parapolitics, fascism, covert power and the Marxist record."><meta name="twitter:image" content="https://paranoidreading.com/img/og-card.png"><!--/pr-meta-->
<meta name="description" content="Browse Paranoid Reading by topic and tag: covers, films and articles on parapolitics, fascism, covert power, crime and the Marxist reading of them.">
<style>
:root{color-scheme:dark;--red:var(--c-d7263d,#d7263d);--ink:var(--c-ececec,#ececec);--ink2:var(--c-c8c8c8,#c8c8c8);--gray:var(--c-9a9a9a,#9a9a9a);--faint:var(--c-777777,#777777);--line:var(--c-2e2e2e,#2e2e2e);--bg:var(--c-0a0a0a,#0a0a0a);--hov:var(--c-141414,#141414)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--red)}
.x-main{max-width:1180px;margin:0 auto;padding:30px 40px 80px}
.x-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--red);margin:0 0 6px}
h1{font-size:44px;line-height:1;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;margin:0 0 10px}
.x-lede{font-size:16px;color:var(--ink2);max-width:760px;margin:0 0 18px}
.x-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ix-find{position:relative;margin:0 0 22px}
.ix-find input{width:100%;font:500 18px "Inter Tight",sans-serif;background:var(--bg);color:var(--ink);border:2px solid var(--red);padding:16px 18px}
.ix-find input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ix-sug{position:absolute;left:0;right:0;top:100%;z-index:20;background:#0a0a0a;border:1px solid var(--line);border-top:0;list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.ix-sug li button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:500 15px "Inter Tight",sans-serif;padding:11px 18px;cursor:pointer}
.ix-sug li button:hover,.ix-sug li button.on{background:#1c1c1c}
.ix-sug small{color:var(--gray);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.ix-fam{margin:0 0 20px}.ix-fam h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray);font-weight:600;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.ix-chips{display:flex;flex-wrap:wrap;gap:6px}
.ix-chip{font:600 13px "Inter Tight",sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);padding:7px 11px;cursor:pointer}
.ix-chip b{color:var(--gray);font-weight:600;margin-left:6px}.ix-chip:hover,.ix-chip.on{border-color:var(--red);color:#fff}.ix-chip.on{background:var(--red);color:#0a0a0a}.ix-chip.on b{color:#0a0a0a}
.ix-tags .ix-chip{font-weight:500;font-size:12.5px;padding:5px 9px}
.ix-res{margin-top:26px;border-top:2px solid var(--red);padding-top:18px;scroll-margin-top:10px}
.ix-res h2{margin:0;font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:1.05}
.ix-blurb{color:var(--ink2);margin:6px 0 12px;max-width:760px}
.ix-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 14px}
.ix-tab{font:700 12px "Inter Tight",sans-serif;letter-spacing:.1em;text-transform:uppercase;background:none;color:var(--ink);border:1px solid var(--line);padding:9px 13px;cursor:pointer}
.ix-tab[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#0a0a0a}
.ix-bar select{font:600 13px "Inter Tight",sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:9px 10px;margin-left:auto}
.ix-open{font-size:13px;margin:0 0 14px;color:var(--gray)}.ix-open a{margin-right:14px}
.ix-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:22px 18px}
.ix-t{position:relative;min-width:0}
.ix-t>a{display:block;color:var(--ink);text-decoration:none}
.ix-cv{aspect-ratio:2/3;background:#141414;border:1px solid var(--line);overflow:hidden;position:relative}
.ix-cv img{width:100%;height:100%;object-fit:cover;display:block}
.ix-t>a:hover .ix-cv{border-color:var(--red)}
.ix-ph{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:40px 10px 10px;height:100%;text-align:center}
.ix-ph b{font-size:15px;line-height:1.2;text-transform:uppercase;font-weight:800}.ix-ph i{font-size:12px;font-style:normal;color:var(--gray)}
.ix-tt{font-weight:700;font-size:14px;line-height:1.25;margin:8px 0 2px}
.ix-mt{font-size:12px;color:var(--gray);line-height:1.3}
.ix-rd{position:absolute;right:6px;top:6px;z-index:3;width:30px;height:30px;background:#0a0a0acc;color:var(--ink);border:1px solid var(--ink);font:800 15px/1 "Inter Tight",sans-serif;cursor:pointer}
.ix-rd[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#0a0a0a}
.ix-t.rd .ix-cv{opacity:.55}
.ix-bd{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;z-index:2}
.ix-bd span{background:var(--red);color:#0a0a0a;font:800 10.5px/1 "Inter Tight",sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:4px 6px}
.ix-more{display:block;margin:26px auto 0;font:800 13px "Inter Tight",sans-serif;letter-spacing:.12em;text-transform:uppercase;background:var(--red);color:#0a0a0a;border:0;padding:14px 22px;cursor:pointer}
.ix-rel{margin:0 0 14px}.ix-rel .x-eyebrow{color:var(--gray)}
@media(max-width:760px){.x-main{padding:20px 16px 60px}h1{font-size:34px}}
</style>
<!--pr-shell--><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,800;0,900;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/pr-theme.css"><link rel="stylesheet" href="/assets/pr-shell.css"><style></style><!--/pr-shell-->
</head>
<body><script src="/assets/pr-shell.js"></script>
<main class="x-main">
  <p class="x-eyebrow">Browse by topic and tag</p>
  <h1>The Index</h1>
  <p class="x-lede">Find a topic or any tag across fiction, film and TV, non-fiction and articles. Covers first, with read marks saved privately in this browser.</p>
  <div class="ix-find">
    <label class="x-sr" for="q">Find a topic or tag</label>
    <input id="q" type="search" autocomplete="off" placeholder="Type a topic or tag: cocaine, gladio, heist, mexico, cults…" role="combobox" aria-expanded="false" aria-controls="sug">
    <ul class="ix-sug" id="sug" role="listbox" hidden></ul>
  </div>
  <section id="dir"></section>
  <section class="ix-res" id="res" hidden aria-live="polite"></section>
</main>
<script>
window.prData=window.prData||function(){return window._prd||(window._prd=fetch('/data/catalogue.json').then(function(r){return r.json();}));};
Promise.all([prData(), fetch('/data/covers.json').then(function(r){return r.json();}).catch(function(){return {};})]).then(function (R) {
var J = R[0], COV = R[1], $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var KEY = 'paranoid_index_read_v1', done = new Set(), okLS = true;
try { var raw = localStorage.getItem(KEY); if (raw) done = new Set(JSON.parse(raw)); } catch (_) { okLS = false; }
function save() { if (okLS) try { localStorage.setItem(KEY, JSON.stringify(Array.from(done))); } catch (_) { okLS = false; } }
var SECT = J.sections, SK = Object.keys(SECT);
var SHORT = {'TrueAnon':'TrueAnon','Death Is Just Around the Corner':'DIJATC','Matt Christman':'Christman','Eyes Wide Open':'EWO','4th Reich Archaeology':'4th Reich','William T. Vollmann':'Vollmann','Ali Winston':'Winston','Current Academic Work':'Academic'};
var E = J.entries.map(function (e) { return {e: e, rid: e.zid || (e.id.indexOf('z-') === 0 ? e.id.slice(2) : e.id), tp: (e.tp || []).concat(e.wk || []), tg: e.tg || []}; });
var TCNT = {}, GCNT = {};
E.forEach(function (x) { x.tp.forEach(function (t) { TCNT[t] = (TCNT[t] || 0) + 1; }); x.tg.forEach(function (t) { GCNT[t] = (GCNT[t] || 0) + 1; }); });
var TOP = J.topics.filter(function (t) { return TCNT[t.id]; });
var TAGS = Object.keys(GCNT).filter(function (t) { return GCNT[t] >= 2; }).sort(function (a, b) { return GCNT[b] - GCNT[a] || (a < b ? -1 : 1); });
function chip(kind, id, label, n, on) { return '<button type="button" class="ix-chip' + (on ? ' on' : '') + '" data-k="' + kind + '" data-id="' + esc(id) + '">' + esc(label) + '<b>' + n + '</b></button>'; }
var cur = null, fmt = 'all', sort = 'year', shown = 48;
function drawDir() {
  var h = J.families.map(function (f) {
    var ts = TOP.filter(function (t) { return t.family === f; }); if (!ts.length) return '';
    return '<div class="ix-fam"><h2>' + esc(f) + '</h2><div class="ix-chips">' + ts.map(function (t) { return chip('topic', t.id, t.label, TCNT[t.id], cur && cur.k === 'topic' && cur.id === t.id); }).join('') + '</div></div>';
  }).join('');
  h += '<div class="ix-fam ix-tags"><h2>Popular tags</h2><div class="ix-chips">' + TAGS.slice(0, 120).map(function (t) { return chip('tag', t, t, GCNT[t], cur && cur.k === 'tag' && cur.id === t); }).join('') + '</div></div>';
  $('dir').innerHTML = h;
}
function matches() {
  if (!cur) return [];
  return E.filter(function (x) { return cur.k === 'topic' ? x.tp.indexOf(cur.id) > -1 : x.tg.indexOf(cur.id) > -1; });
}
function tile(x) {
  var e = x.e, s = SECT[e.x], f = COV[e.id], r = done.has(x.rid);
  var bd = (e.pl || []).slice(0, 2).map(function (p) { return '<span>' + esc(SHORT[p.n] || p.n) + '</span>'; }).join('');
  var cv = f ? '<img loading="lazy" decoding="async" src="/img/covers/' + esc(f) + '" alt="Cover of ' + esc(e.t) + '">' : '<div class="ix-ph"><b>' + esc(e.t) + '</b><i>' + esc((e.by || '').replace(/^(Dir\.|Created by)\s*/, '')) + '</i></div>';
  return '<div class="ix-t' + (r ? ' rd' : '') + '"><button type="button" class="ix-rd" data-rid="' + esc(x.rid) + '" aria-pressed="' + r + '" aria-label="Mark ' + esc(e.t) + ' as read" title="Mark as read">\u2713</button>' +
    '<a href="' + s.path + '#id=' + encodeURIComponent(e.id) + '"><div class="ix-cv">' + (bd ? '<div class="ix-bd">' + bd + '</div>' : '') + cv + '</div><div class="ix-tt">' + esc(e.t) + '</div><div class="ix-mt">' + esc((e.by || '') + (e.y ? ' \u00b7 ' + e.y : '') + ' \u00b7 ' + s.label) + '</div></a></div>';
}
function drawRes() {
  var box = $('res');
  if (!cur) { box.hidden = true; return; }
  var all = matches(), t = cur.k === 'topic' ? J.topics.filter(function (z) { return z.id === cur.id; })[0] : null;
  var title = t ? t.label : cur.id, counts = {all: all.length};
  SK.forEach(function (k) { counts[k] = all.filter(function (x) { return x.e.x === k; }).length; });
  var list = fmt === 'all' ? all : all.filter(function (x) { return x.e.x === fmt; });
  list = list.slice().sort(function (a, b) { return sort === 'title' ? a.e.t.toLowerCase().localeCompare(b.e.t.toLowerCase()) : (b.e.y || 0) - (a.e.y || 0) || a.e.t.localeCompare(b.e.t); });
  var rel = {}; all.forEach(function (x) { x.tg.forEach(function (g) { if (!(cur.k === 'tag' && g === cur.id)) rel[g] = (rel[g] || 0) + 1; }); });
  var relTags = Object.keys(rel).filter(function (g) { return GCNT[g] >= 2; }).sort(function (a, b) { return rel[b] - rel[a] || GCNT[a] - GCNT[b]; }).slice(0, 14);
  var q = encodeURIComponent(cur.k === 'tag' ? cur.id : (t ? t.label : cur.id));
  var h = '<p class="x-eyebrow">' + (t ? esc(t.family) : 'Tag') + '</p><h2>' + esc(title) + '</h2>' + (t ? '<p class="ix-blurb">' + esc(t.blurb) + '</p>' : '');
  h += '<div class="ix-bar"><button type="button" class="ix-tab" data-f="all" aria-pressed="' + (fmt === 'all') + '">All ' + counts.all + '</button>' + SK.filter(function (k) { return counts[k]; }).map(function (k) { return '<button type="button" class="ix-tab" data-f="' + k + '" aria-pressed="' + (fmt === k) + '">' + esc(SECT[k].label) + ' ' + counts[k] + '</button>'; }).join('') +
    '<label class="x-sr" for="srt">Sort</label><select id="srt"><option value="year"' + (sort === 'year' ? ' selected' : '') + '>Newest first</option><option value="title"' + (sort === 'title' ? ' selected' : '') + '>Title A to Z</option></select></div>';
  if (cur.k === 'tag') h += '<p class="ix-open">Open in the section pages: ' + SK.filter(function (k) { return counts[k]; }).map(function (k) { return '<a href="' + SECT[k].path + '#q=' + q + '">' + esc(SECT[k].label) + '</a>'; }).join('') + '</p>';
  if (relTags.length) h += '<div class="ix-rel ix-tags"><p class="x-eyebrow">Related tags</p><div class="ix-chips">' + relTags.map(function (g) { return chip('tag', g, g, GCNT[g], false); }).join('') + '</div></div>';
  h += '<div class="ix-grid">' + list.slice(0, shown).map(tile).join('') + '</div>';
  if (list.length > shown) h += '<button type="button" class="ix-more" id="more">Show more (' + (list.length - shown) + ' left)</button>';
  box.innerHTML = h; box.hidden = false;
}
function select(k, id, scroll) {
  cur = {k: k, id: id}; fmt = 'all'; shown = 48; drawDir(); drawRes();
  history.replaceState(null, '', '#' + k + '=' + encodeURIComponent(id));
  if (scroll) $('res').scrollIntoView({behavior: 'smooth', block: 'start'});
}
document.addEventListener('click', function (ev) {
  var c = ev.target.closest('.ix-chip'); if (c) { select(c.dataset.k, c.dataset.id, true); return; }
  var tb = ev.target.closest('.ix-tab'); if (tb) { fmt = tb.dataset.f; shown = 48; drawRes(); return; }
  var rd = ev.target.closest('.ix-rd'); if (rd) { ev.preventDefault(); var id = rd.dataset.rid; if (done.has(id)) done.delete(id); else done.add(id); save(); rd.setAttribute('aria-pressed', done.has(id)); rd.parentNode.classList.toggle('rd', done.has(id)); return; }
  if (ev.target.id === 'more') { shown += 48; drawRes(); }
  if (!ev.target.closest('.ix-find')) { $('sug').hidden = true; $('q').setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('change', function (ev) { if (ev.target.id === 'srt') { sort = ev.target.value; drawRes(); } });
var q = $('q'), sug = $('sug'), act = -1, opts = [];
function suggest() {
  var v = q.value.trim().toLowerCase(); act = -1;
  if (!v) { sug.hidden = true; q.setAttribute('aria-expanded', 'false'); return; }
  var a = TOP.filter(function (t) { return t.label.toLowerCase().indexOf(v) > -1; }).slice(0, 5).map(function (t) { return {k: 'topic', id: t.id, l: t.label, n: TCNT[t.id], s: 'topic'}; });
  var b = TAGS.filter(function (t) { return t.indexOf(v) > -1; }).sort(function (x, y) { return (x.indexOf(v) === 0 ? 0 : 1) - (y.indexOf(v) === 0 ? 0 : 1) || GCNT[y] - GCNT[x]; }).slice(0, 8).map(function (t) { return {k: 'tag', id: t, l: t, n: GCNT[t], s: 'tag'}; });
  opts = a.concat(b); if (!opts.length) opts = [{k: 'tag', id: v, l: v, n: 0, s: 'no tag yet'}];
  sug.innerHTML = opts.map(function (o, i) { return '<li role="option"><button type="button" data-i="' + i + '">' + esc(o.l) + '<small>' + o.s + (o.n ? ', ' + o.n : '') + '</small></button></li>'; }).join('');
  sug.hidden = false; q.setAttribute('aria-expanded', 'true');
}
q.addEventListener('input', suggest);
q.addEventListener('keydown', function (ev) {
  var bs = sug.querySelectorAll('button');
  if (ev.key === 'ArrowDown' && bs.length) { ev.preventDefault(); act = Math.min(bs.length - 1, act + 1); }
  else if (ev.key === 'ArrowUp' && bs.length) { ev.preventDefault(); act = Math.max(0, act - 1); }
  else if (ev.key === 'Enter') { ev.preventDefault(); var o = opts[act < 0 ? 0 : act]; if (o) { pick(o); } return; }
  else if (ev.key === 'Escape') { sug.hidden = true; return; } else return;
  bs.forEach(function (b, i) { b.classList.toggle('on', i === act); });
});
function pick(o) { sug.hidden = true; q.value = ''; select(o.k, o.id, true); }
sug.addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (b) pick(opts[+b.dataset.i]); });
function fromHash() {
  var h = decodeURIComponent(location.hash.slice(1)); if (!h) return;
  var m = h.match(/^(topic|tag)=(.+)$/);
  if (m) { select(m[1], m[2], false); return; }
  var id = h.split(/[,?]/)[0]; if (TOP.some(function (t) { return t.id === id; })) select('topic', id, false);
}
drawDir(); fromHash();
});
</script>
</body>
