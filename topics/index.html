<meta name="description" content="Every Paranoid Reading entry in one index, browsable by topic: fiction, film and TV, non-fiction and articles on parapolitics, fascism, covert power and the Marxist record.">
<style>
  :root{--ox:var(--c-6b1414,#6B1414);--ox2:var(--c-8f2320,#8f2320);--ink:var(--c-1a1a1a,#1a1a1a);--gray:var(--c-5a5a5a,#5a5a5a);--faint:var(--c-c9b8b8,#c9b8b8);

  *{box-sizing:border-box} html,body{margin:0}

  .head-inner{max-width:900px;margin:0 auto;padding:14px 18px 12px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:0 0 10px;box-shadow:var(--shadow);transition:opacity .2s}

  .ctop{display:flex;gap:10px;align-items:flex-start}
  .chk{flex:0 0 auto;padding-top:2px}
  .chk input{position:absolute;opacity:0;width:22px;height:22px;cursor:pointer}
  .box{display:inline-block;width:22px;height:22px;border:2px solid var(--faint);border-radius:6px;position:relative;cursor:pointer;transition:.15s}
  .chk input:checked + .box{background:var(--ox);border-color:var(--ox)}
  .chk input:checked + .box::after{content:"\\2713";color:var(--c-ffffff,#fff);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-size:14px;font-weight:bold}
  .cbody{flex:1;min-width:0}

  .cite{margin:3px 0 0;font-size:13px;color:var(--gray)}
  .badges{margin:7px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .badge{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-family:Arial,Helvetica,sans-serif;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--gray);background:var(--c-fbf9f5,#fbf9f5);white-space:nowrap}
  .badge.kind{color:var(--ox);border-color:var(--c-e3cfcf,#e3cfcf);background:var(--c-fbf3f0,#fbf3f0)}
  .g-primarydocument{color:var(--c-2d4f6b,#2d4f6b);border-color:var(--c-cfdbe6,#cfdbe6);background:var(--c-f1f6fa,#f1f6fa)}
  .g-peerreviewed{color:var(--c-2f5d3a,#2f5d3a);border-color:var(--c-cfe0d2,#cfe0d2);background:var(--c-f2f8f3,#f2f8f3)}
  .g-documented{color:var(--c-2f5d3a,#2f5d3a);border-color:var(--c-cfe0d2,#cfe0d2);background:var(--c-f6faf6,#f6faf6)}
  .g-reportage{color:var(--c-5a5a5a,#5a5a5a)}
  .g-contested{color:var(--c-8a6a1f,#8a6a1f);border-color:var(--c-e8dcbd,#e8dcbd);background:var(--c-fbf7ea,#fbf7ea)}
  .g-disputed{color:var(--ox2);border-color:var(--c-e3cfcf,#e3cfcf);background:var(--c-fbf3f0,#fbf3f0)}
  .g-movementpublication{color:var(--c-6b3f6b,#6b3f6b);border-color:var(--c-e0cfe0,#e0cfe0);background:var(--c-f9f2f9,#f9f2f9)}
  .g-dramatization{color:var(--c-4a4a6a,#4a4a6a);border-color:var(--c-d6d6e4,#d6d6e4);background:var(--c-f5f5fa,#f5f5fa)}
  .g-fiction{color:var(--c-5a5a5a,#5a5a5a)}
  .g-unidentified{color:var(--c-8a6a1f,#8a6a1f);border-color:var(--c-e8dcbd,#e8dcbd);background:var(--c-fbf7ea,#fbf7ea)}
  .flag{font-size:11px;font-family:Arial,Helvetica,sans-serif;color:var(--ox2)}
  .note{margin:8px 0 0;font-size:13.5px;color:var(--c-444444,#444);background:var(--c-fbf9f5,#fbf9f5);border-left:3px solid var(--faint);padding:6px 10px;border-radius:0 6px 6px 0}
  .note b{color:var(--ink)}
  .hyp{margin:9px 0 0;font-size:14.5px;color:var(--c-333333,#333);line-height:1.55}
  .links{margin:8px 0 0;font-size:13px}
  .links a{margin-right:12px}
  .empty{padding:40px 10px;text-align:center;color:var(--gray);font-style:italic}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--gray)}
  footer a{font-weight:bold}
  @media(max-width:560px){h1{font-size:22px}.controls input[type=search]{min-width:120px}.ctitle{font-size:15.5px}}

  .topicbar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .combo{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .combo[hidden]{display:none}
  .combo select{font-family:inherit;font-size:13.5px;padding:6px 8px;max-width:340px}
  .combo .chip{cursor:pointer;padding:6px 9px;margin-right:6px}
  .topicbar select{font-family:inherit;font-size:15px;font-weight:bold;color:var(--ox);padding:8px 10px;border:1px solid var(--ox);border-radius:8px;background:var(--c-ffffff,#fff);flex:1;min-width:220px;max-width:460px}
  .navbtn{font-family:inherit;font-size:15px;color:var(--ox);background:var(--c-ffffff,#fff);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;line-height:1}
  .navbtn:hover{background:var(--c-fbf3f0,#fbf3f0)}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:18px 0}
  .tcard{display:block;background:var(--c-ffffff,#fff);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;box-shadow:var(--shadow)}
  .tcard:hover{background:var(--c-fbf3f0,#fbf3f0);border-color:var(--c-e3cfcf,#e3cfcf)}
  .tcard .tn{display:block;font-size:11px;letter-spacing:.14em;color:var(--gray);font-family:Arial,Helvetica,sans-serif}
  .tcard .tl{display:block;font-size:16px;font-weight:bold;color:var(--ox);margin:2px 0 4px;line-height:1.25}
  .tcard .tb{display:block;font-size:13px;color:var(--c-444444,#444);line-height:1.5}
  .badge.flair{background:var(--c-d7263d,#d7263d);color:var(--c-0b0b0a,#0b0b0a);border-color:var(--c-d7263d,#d7263d);font-weight:800}
  .pls{margin:7px 0 0;display:flex;flex-wrap:wrap;gap:6px}
  .badge.weak{color:var(--gray);font-style:italic;text-transform:none;letter-spacing:0}
  .also{margin:8px 0 0;font-size:13px;color:var(--gray)}
  .sec .kicker{margin-bottom:4px}
.pr-more-row{display:flex;gap:10px;justify-content:center;margin:22px 0 10px}.pr-more-row .btn{font-size:14px;padding:10px 16px}
</style>

</head>
<body><script src="/assets/pr-shell.js"></script>

<header>
  <div class="head-inner">
    <div class="brand"><a href="/">Paranoid Reading</a> &middot; The Index</div>
    <h1 id="topicTitle">The Index</h1>
    <p class="sub" id="topicBlurb">Everything in the library, browsable by topic.</p>
    <div class="topicbar">
      <button class="navbtn" id="prev" aria-label="Previous topic">&larr;</button>
      <select id="topic" aria-label="Choose a topic"></select>
      <button class="navbtn" id="next" aria-label="Next topic">&rarr;</button>
      <span class="progtext" id="topicCount"></span>
    </div>
    <div class="combo" id="combo" hidden>
      <span class="progtext">Combine with</span>
      <span id="comboChips"></span>
      <select id="addTopic" aria-label="Add another topic"></select>
      <select id="match" aria-label="How to combine the topics" hidden><option value="all">Filed under all of these</option><option value="any">Filed under any of these</option></select>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <input type="search" id="search" placeholder="Search within this topic…" autocomplete="off">
    <select id="form" aria-label="Filter by material"></select>
    <select id="grade" aria-label="Filter by grade"></select>
    <select id="region" aria-label="Filter by region"></select>
    <select id="sort" aria-label="Sort">
      <option value="form">By format</option>
      <option value="grade">By grade</option>
      <option value="year">Newest first</option>
      <option value="title">Title A–Z</option>
      <option value="unread">Unread first</option>
    </select>
    <button class="btn" id="allTopics">All topics</button>
  </div>
  <div class="count" id="count">Opening the files…</div>
  <div id="grid" class="tgrid" hidden></div>
  <div id="list"></div>
  <div id="more" class="pr-more-row" hidden><button class="btn" id="moreBtn" type="button">Show more</button> <button class="btn" id="allBtn" type="button">Show all</button></div>
  <footer>
    <p>Part of <b>Paranoid Reading</b>. 1,404 entries across Fiction, Film and TV, Non-Fiction and Articles and Journals, sorted into topics. Read marks are saved privately in this browser.</p>
  </footer>
</div>
<script>
window.prData=window.prData||function(){return window._prd||(window._prd=fetch('/data/catalogue.json').then(function(r){return r.json();}));};

prData().then(function (J) {
const SECT = J.sections;
const FORMS = Object.keys(SECT).map(k => SECT[k].label);
const GRADES = ["Fiction", "Dramatization", "Primary text", "Primary document", "Peer reviewed", "Documented", "Theory", "Reportage", "Contested", "Disputed", "Movement publication"];
const REGIONS = J.regions;
const ITEMS = J.entries.map(e => ({
  id: e.zid || (e.id.indexOf('z-') === 0 ? e.id.slice(2) : e.id), eid: e.id, x: e.x,
  title: e.t, by: e.by || '', cite: (e.by || '') + (e.src ? '. ' + e.src : ''), grade: e.g, kind: e.k, form: SECT[e.x].label,
  year: e.y, url: e.url || '', doi: e.doi || '', note: e.note || '', annotate: e.pending ? '' : e.s,
  topics: e.tp || [], weak: e.wk || [], regions: e.rg || [], pl: e.pl || []
}));
ITEMS.forEach(i => { i.all = i.topics.concat(i.weak); i.s = (i.title + ' ' + i.cite + ' ' + i.grade + ' ' + i.kind + ' ' + i.note + ' ' + i.annotate + ' ' + i.pl.map(p => p.n + ' ' + (p.d || '')).join(' ')).toLowerCase(); });
const CNT = {}; ITEMS.forEach(i => i.all.forEach(t => CNT[t] = (CNT[t] || 0) + 1));
const TOPICS = J.topics.filter(t => CNT[t.id]).map(t => Object.assign({}, t, {n: CNT[t.id]}));
const KEY = "paranoid_index_read_v1";
let done = new Set(), ok = true;
try { const r = localStorage.getItem(KEY); if (r) done = new Set(JSON.parse(r)); } catch(_) { ok = false; }
function save(){ if(!ok) return; try{ localStorage.setItem(KEY, JSON.stringify([...done])); }catch(_){ ok=false; } }
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'');
const $ = id => document.getElementById(id);
const PAGE = 60;
let SHOWN = PAGE;

$("topic").innerHTML = '<option value="all">All topics, every title ('+ITEMS.length.toLocaleString('en-US')+')</option>' + TOPICS.map(t => '<option value="'+t.id+'">'+esc(t.label)+' ('+t.n+')</option>').join('');
$("form").innerHTML = '<option value="ALL">All formats</option>' + FORMS.map(f => '<option>'+esc(f)+'</option>').join('');
$("grade").innerHTML = '<option value="ALL">All grades</option>' + GRADES.map(g => '<option>'+g+'</option>').join('');
$("region").innerHTML = '<option value="ALL">Anywhere</option>' + REGIONS.map(r => '<option value="'+r.id+'">'+esc(r.label)+'</option>').join('');

let current = 'all', extra = [], matchAny = false;
const tset = () => current === 'all' ? [] : [current].concat(extra);
const under = (i, set, any) => any ? set.some(t => i.all.includes(t)) : set.every(t => i.all.includes(t));
function parseHash(h){
  const [a, qs] = h.split('?'), ids = a.split(',').filter(Boolean), ok = id => TOPICS.some(t => t.id === id);
  if (!ids.length || (ids[0] !== 'all' && !ok(ids[0]))) return null;
  if (ids[0] === 'all') return {id: 'all', extra: [], any: false};
  const ex = [...new Set(ids.slice(1).filter(x => ok(x) && x !== ids[0]))].slice(0, 2);
  return {id: ids[0], extra: ex, any: ex.length > 0 && /(^|&)m=any(&|$)/.test(qs || '')};
}
const hashFor = () => '#' + (current === 'all' ? 'all' : tset().join(',')) + (extra.length && matchAny ? '?m=any' : '');
const ALL = {id:'all', label:'The Index', blurb:'Every entry on the site in one list, sorted by topic. Pick a topic above to narrow it, or use the arrow keys to step through them.', n:ITEMS.length};
const topicOf = id => id === 'all' ? ALL : (TOPICS.find(t => t.id === id) || ALL);

function card(i){
  const isDone = done.has(i.id);
  const links = [];
  if (i.doi) links.push('<a href="https://doi.org/'+esc(i.doi)+'" target="_blank" rel="noopener">DOI</a>');
  if (i.url) links.push('<a href="'+esc(i.url)+'" target="_blank" rel="noopener">Source</a>');
  links.push('<a href="/'+SECT[i.x].path+'/#id='+encodeURIComponent(i.eid)+'">Open in '+esc(SECT[i.x].label)+'</a>');
  const others = i.topics.filter(t => t !== current && CNT[t]).slice(0,4);
  return '<article class="card'+(isDone?' done':'')+'">'
    + '<div class="ctop">'
    + '<label class="chk"><input type="checkbox" data-id="'+esc(i.id)+'"'+(isDone?' checked':'')+' aria-label="Mark read"><span class="box"></span></label>'
    + '<div class="cbody">'
    + '<div class="ctitle">'+esc(i.title)+'</div>'
    + (i.cite ? '<p class="cite">'+esc(i.cite)+'</p>' : '')
    + '<div class="badges"><span class="badge kind">'+esc(i.kind)+'</span>'
    + '<span class="badge g-'+slug(i.grade)+'">'+esc(i.grade)+'</span>'
    + (i.year?'<span class="badge">'+(i.year<0?(-i.year)+' BCE':i.year)+'</span>':'')
    + (i.weak.includes(current)?'<span class="badge weak" title="Placed here by keyword match">auto</span>':'')
    + '</div>'
    + (i.pl.length?'<p class="pls">'+i.pl.map(p => '<span class="badge flair" title="'+esc(p.d||'')+'">'+esc(p.n)+'</span>').join('')+'</p>':'')
    + (i.note?'<p class="note"><b>On the record:</b> '+esc(i.note)+'</p>':'')
    + (i.annotate?'<p class="hyp">'+esc(i.annotate)+'</p>':'')
    + (others.length?'<p class="also">Also under: '+others.map(t => '<a href="#'+t+'" data-topic="'+t+'">'+esc(topicOf(t).label)+'</a>').join(' &middot; ')+'</p>':'')
    + '<p class="links">'+links.join('')+'</p>'
    + '</div></div></article>';
}
function selected(){
  const q = $("search").value.trim().toLowerCase();
  const f = $("form").value, g = $("grade").value, r = $("region").value, sort = $("sort").value;
  const set = tset(), inTopic = !set.length ? ITEMS : ITEMS.filter(i => under(i, set, matchAny));
  const toks = q.split(/\s+/).filter(Boolean);
  const sel = inTopic.filter(i => toks.every(t => i.s.includes(t)) && (f==='ALL'||i.form===f)
    && (g==='ALL'||i.grade===g) && (r==='ALL'||i.regions.includes(r)));
  let groups = [];
  if (sort === 'form') FORMS.forEach(k => groups.push([k, sel.filter(i => i.form === k)]));
  else if (sort === 'grade') GRADES.forEach(k => groups.push([k, sel.filter(i => i.grade === k)]));
  else {
    const a = [...sel];
    if (sort==='year') a.sort((x,y)=>(y.year||0)-(x.year||0));
    else if (sort==='title') a.sort((x,y)=>x.title.localeCompare(y.title));
    else if (sort==='unread') a.sort((x,y)=>(done.has(x.id)-done.has(y.id)));
    groups.push([null, a]);
  }
  if (sort === 'form' || sort === 'grade') groups.forEach(gr => gr[1].sort((x,y)=>x.title.localeCompare(y.title)));
  return {inTopic, sel, groups: groups.filter(gr => gr[1].length)};
}
function render(){
  const t = topicOf(current);
  $("topic").value = t.id;
  $("topicTitle").textContent = t.label;
  $("topicBlurb").textContent = extra.length ? 'Entries filed under ' + (matchAny ? 'any' : 'all') + ' of: ' + tset().map(x => topicOf(x).label).join(', ') + '.' : t.blurb;
  $("combo").hidden = current === 'all';
  $("comboChips").innerHTML = extra.map(x => '<button type="button" class="chip on" data-x="' + x + '" title="Remove this topic">' + esc(topicOf(x).label) + ' ×</button>').join('');
  const base = tset(), opts = TOPICS.filter(x => !base.includes(x.id)).map(x => [x, ITEMS.filter(i => under(i, base.concat(x.id), false)).length]).filter(o => matchAny || o[1]);
  $("addTopic").hidden = extra.length >= 2 || !opts.length;
  $("addTopic").innerHTML = '<option value="">Add a topic…</option>' + opts.map(o => '<option value="' + o[0].id + '">' + esc(o[0].label) + (matchAny ? '' : ' (' + o[1] + ' in common)') + '</option>').join('');
  $("match").hidden = !extra.length; $("match").value = matchAny ? 'any' : 'all';
  const {inTopic, sel, groups} = selected();
  $("topicCount").textContent = inTopic.length.toLocaleString('en-US') + ' entries';
  const readHere = inTopic.filter(i => done.has(i.id)).length;
  $("count").textContent = 'Showing ' + Math.min(SHOWN, sel.length) + ' of ' + sel.length.toLocaleString('en-US') + (sel.length !== inTopic.length ? ' matches (' + inTopic.length.toLocaleString('en-US') + ' in this topic)' : ' in this topic') + ' · '
    + readHere + ' read here · ' + done.size + ' read across the index';
  const list = $("list"); list.innerHTML = '';
  $("more").hidden = sel.length <= SHOWN;
  $("moreBtn").textContent = 'Show ' + Math.min(PAGE, sel.length - SHOWN) + ' more (' + (sel.length - SHOWN) + ' left)';
  $("allBtn").textContent = 'Show all ' + sel.length.toLocaleString('en-US');
  if (!sel.length) { list.innerHTML = '<div class="empty">Nothing here with those filters.</div>'; return; }
  let left = SHOWN, html = '';
  for (const g2 of groups) {
    if (left <= 0) break;
    const part = g2[1].slice(0, left); left -= part.length;
    html += '<section class="sec">' + (g2[0] ? '<div class="kicker">'+esc(g2[0])+' <span style="opacity:.6">'+g2[1].length+'</span></div><hr class="sec-rule">' : '') + part.map(card).join('') + '</section>';
  }
  list.innerHTML = html;
}
function rerender(){ SHOWN = PAGE; render(); }
function showGrid(on){
  $("grid").hidden = !on; $("list").hidden = on; $("more").hidden = on || $("more").hidden;
  if (on) $("grid").innerHTML = TOPICS.map(t =>
    '<a class="tcard" href="#'+t.id+'" data-topic="'+t.id+'"><span class="tn">'+t.n+' entries</span>'
    + '<span class="tl">'+esc(t.label)+'</span><span class="tb">'+esc(t.blurb)+'</span></a>').join('');
}
function go(id, ex, any){ current = id; extra = current === 'all' ? [] : (ex || []); matchAny = !!any && extra.length > 0; showGrid(false); if (location.hash !== hashFor()) history.replaceState(null, '', hashFor()); rerender(); window.scrollTo({top:0}); }
function recombine(){ history.replaceState(null, '', hashFor()); rerender(); }
$("addTopic").addEventListener('change', e => { if (e.target.value && extra.length < 2) { extra.push(e.target.value); recombine(); } });
$("match").addEventListener('change', e => { matchAny = e.target.value === 'any'; recombine(); });
$("comboChips").addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; extra = extra.filter(x => x !== b.dataset.x); if (!extra.length) matchAny = false; recombine(); });
$("topic").addEventListener('change', e => go(e.target.value));
$("prev").addEventListener('click', () => { const n = TOPICS.findIndex(t=>t.id===current); go(n < 0 ? TOPICS[TOPICS.length-1].id : n === 0 ? 'all' : TOPICS[n-1].id); });
$("next").addEventListener('click', () => { const n = TOPICS.findIndex(t=>t.id===current); go(n < 0 ? TOPICS[0].id : n === TOPICS.length-1 ? 'all' : TOPICS[n+1].id); });
$("allTopics").addEventListener('click', () => showGrid($("grid").hidden));
let tm; $("search").addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(rerender, 120); });
["form","grade","region","sort"].forEach(id => $(id).addEventListener('input', rerender));
$("moreBtn").addEventListener('click', () => { SHOWN += PAGE; render(); });
$("allBtn").addEventListener('click', () => { SHOWN = 1e9; render(); });
document.addEventListener('click', e => {
  const a = e.target.closest('[data-topic]'); if (!a) return;
  e.preventDefault(); go(a.dataset.topic);
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.key === 'ArrowRight') $("next").click();
  if (e.key === 'ArrowLeft') $("prev").click();
});
$("list").addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox][data-id]'); if (!cb) return;
  if (cb.checked) done.add(cb.dataset.id); else done.delete(cb.dataset.id);
  save(); cb.closest('.card').classList.toggle('done', cb.checked);
});
window.addEventListener('hashchange', () => {
  const p = parseHash(location.hash.slice(1));
  if (p && location.hash !== hashFor()) go(p.id, p.extra, p.any);
});
const p0 = parseHash(location.hash.slice(1));
if (p0) { current = p0.id; extra = p0.extra; matchAny = p0.any; }
render();
}).catch(function () { document.getElementById('count').textContent = 'The files could not be loaded. Reload the page to try again.'; });
</script>
