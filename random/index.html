<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Pick · Paranoid Reading</title>
<!--pr-meta--><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="canonical" href="https://paranoidreading.com/random/"><meta property="og:site_name" content="Paranoid Reading"><meta property="og:type" content="website"><meta property="og:title" content="Random Pick · Paranoid Reading"><meta property="og:description" content="Pick a format and a few criteria and get one random recommendation from the Paranoid Reading list."><meta property="og:url" content="https://paranoidreading.com/random/"><meta property="og:image" content="https://paranoidreading.com/img/og-card.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Paranoid Reading: A reading list for the parapolitical, the paranoid and the Marxist."><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Random Pick · Paranoid Reading"><meta name="twitter:description" content="Pick a format and a few criteria and get one random recommendation from the Paranoid Reading list."><meta name="twitter:image" content="https://paranoidreading.com/img/og-card.png"><!--/pr-meta-->
<meta name="description" content="Pick a format and a few criteria and get one random recommendation from the Paranoid Reading list.">
<style>
:root{color-scheme:dark;--red:var(--c-d7263d,#d7263d);--ink:var(--c-e6e1d3,#e6e1d3);--ink2:var(--c-c9c3b3,#c9c3b3);--gray:var(--c-8e897d,#8e897d);--faint:var(--c-5c584f,#5c584f);--line:var(--c-3d3a33,#3d3a33);--bg:var(--c-0b0b0a,#0b0b0a);--hov:var(--c-141412,#141412)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--red)}
.x-main{max-width:1080px;margin:0 auto;padding:30px 40px 80px}
.x-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--red);margin:0 0 6px}
.x-lede{font-size:18px;line-height:1.5;color:var(--c-d4cebf,#d4cebf);max-width:720px;margin:0 0 6px}
.x-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){.x-main{padding:20px 16px 60px}.x-lede{font-size:16px}}

.x-head{border-bottom:1px solid var(--ink);padding-bottom:16px;margin-bottom:22px}
.x-head h1{font-size:clamp(38px,7vw,64px);margin:4px 0 12px}
.x-step{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gray);margin:0 0 8px}
.x-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.x-chip{font:700 13px/1 "Inter Tight",sans-serif;letter-spacing:.04em;color:var(--ink2);background:transparent;border:1px solid var(--line);padding:11px 14px;cursor:pointer}
.x-chip small{color:var(--faint);font-weight:600;margin-left:6px}
.x-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.x-chip[aria-pressed="true"] small{color:var(--c-5c584f,#5c584f)}
.x-chip:hover{border-color:var(--gray)}
.x-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px;margin:0 0 22px}
.x-row label{display:flex;flex-direction:column;gap:5px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gray);min-width:0}
.x-row select{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;font-weight:400;padding:9px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);min-width:0}
.x-go{font:900 15px/1 "Inter Tight",sans-serif;letter-spacing:.12em;text-transform:uppercase;background:var(--red);color:var(--bg);border:0;padding:18px 26px;cursor:pointer}
.x-go:hover,.x-go:focus-visible{background:var(--ink)}
.x-pool{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--gray);margin-left:14px}
.x-result{margin-top:26px;border:2px solid var(--red);padding:22px 24px;position:relative}
.x-result .x-stamp{position:absolute;top:-12px;left:18px;background:var(--red);color:var(--bg);font:900 11px/1 "Inter Tight",sans-serif;letter-spacing:.18em;padding:6px 10px}
.x-result h2{font-size:clamp(28px,4.5vw,44px);font-weight:900;letter-spacing:-.03em;line-height:1;margin:8px 0 8px;color:var(--ink)}
.x-rmeta{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--red)}
.x-rby{font-size:17px;color:var(--ink2);margin:0 0 10px}
.x-rsum{font-size:18px;line-height:1.5;color:var(--ink);max-width:680px;margin:0 0 14px}
.x-rkw{font-size:12px;color:var(--gray);margin:0 0 6px}
.x-rpl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.x-rpl span{font:800 10px/1 "Inter Tight",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--red);padding:5px 7px}
.x-ract{display:flex;flex-wrap:wrap;gap:8px}
.x-ract a,.x-ract button{font:800 11px/1 "Inter Tight",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--red);border:1px solid var(--red);background:transparent;padding:10px 12px;text-decoration:none;cursor:pointer}
.x-empty{border:1px dashed var(--line);padding:24px;color:var(--gray);margin-top:26px}
@media(max-width:760px){.x-row{grid-template-columns:1fr}.x-pool{display:block;margin:10px 0 0}}
</style>
<!--pr-shell--><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,800;0,900;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/pr-theme.css"><link rel="stylesheet" href="/assets/pr-shell.css"><style>:root{--file:"PR/0025"}</style><!--/pr-shell-->
</head>
<body><script src="/assets/pr-shell.js"></script>
<main class="x-main">
  <div class="x-head">
    <p class="x-eyebrow">Exhibit E · Leave it to chance</p>
    <h1>Random Pick</h1>
    <p class="x-lede">Choose what you are in the mood for, narrow it if you like, and draw one thing from the files.</p>
  </div>
  <p class="x-step">1 · Format <button type="button" id="only" style="all:unset;cursor:pointer;color:var(--red);margin-left:10px">Select all or none</button></p>
  <div class="x-chips" id="media"></div>
  <p class="x-step">2 · Narrow it (optional)</p>
  <div class="x-row">
    <label for="era">Era<select id="era"></select></label>
    <label for="kw">Keyword<select id="kw"></select></label>
    <label for="pl">Reading list<select id="pl"></select></label>
  </div>
  <div><button type="button" class="x-go" id="go">Give me a random pick</button><span class="x-pool" id="pool" aria-live="polite"></span></div>
  <div id="out" aria-live="polite"></div>
</main>
<script>
prData().then(function (J) {
const DATA = J.entries.map(e => Object.assign({}, e, {pl: (e.pl || []).map(p => p.n)}));

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yr = y => y == null ? 'n.d.' : (y < 0 ? (-y) + ' BCE' : (y < 1000 ? 'c. ' + y : y));
const SECT = {novel: ['novels', 'Fiction'], screen: ['film-tv', 'Film and TV'], monograph: ['nonfiction', 'Non-Fiction'], article: ['articles', 'Articles and Journals']};
const MEDIA = [
  ['Novel', e => e.x === 'novel' && /Novel|Stories|Theory-fiction|Anthology/.test(e.k)],
  ['Graphic novel', e => e.k === 'Graphic novel' && e.x === 'novel'],
  ['Poetry and drama', e => e.x === 'novel' && /Poetry|Epic poem|Drama/.test(e.k)],
  ['Movie', e => e.x === 'screen' && e.k === 'Film'],
  ['TV show', e => e.x === 'screen' && e.k === 'Series'],
  ['Documentary', e => e.x === 'screen' && /Documentary|Video|Audio/.test(e.k)],
  ['Non-fiction book', e => e.x === 'monograph'],
  ['Article or journal', e => e.x === 'article']];
const ERAS = [['Any era', -1e9, 1e9], ['Before 1900', -1e9, 1899], ['1900 to 1944', 1900, 1944], ['1945 to 1991', 1945, 1991], ['1992 to 2000', 1992, 2000], ['Since 2001', 2001, 1e9]];
const POOL0 = DATA.filter(e => !e.pending);
const on = new Set(MEDIA.map(m => m[0]));
$('media').innerHTML = MEDIA.map(([n, f]) => '<button type="button" class="x-chip" aria-pressed="true" data-m="' + n + '">' + n + '<small>' + POOL0.filter(f).length + '</small></button>').join('');
$('era').innerHTML = ERAS.map((e, i) => '<option value="' + i + '">' + e[0] + '</option>').join('');
const cnt = fn => { const m = new Map(); POOL0.forEach(e => (fn(e) || []).forEach(v => m.set(v, (m.get(v) || 0) + 1))); return [...m].sort((a, b) => a[0].localeCompare(b[0])); };
$('kw').innerHTML = '<option value="">Any keyword</option>' + cnt(e => e.kw).map(([k, n]) => '<option value="' + esc(k) + '">' + esc(k) + ' (' + n + ')</option>').join('');
$('pl').innerHTML = '<option value="">Any list</option>' + cnt(e => e.pl).map(([k, n]) => '<option value="' + esc(k) + '">' + esc(k) + ' (' + n + ')</option>').join('');
function pool() {
  const ms = MEDIA.filter(m => on.has(m[0])).map(m => m[1]), er = ERAS[+$('era').value], kw = $('kw').value, pl = $('pl').value;
  return POOL0.filter(e => ms.some(f => f(e)) && ((er[1] < -1e8 && er[2] > 1e8) || (e.y != null && e.y >= er[1] && e.y <= er[2])) && (!kw || (e.kw || []).includes(kw)) && (!pl || (e.pl || []).includes(pl)));
}
function count() { const n = pool().length; $('pool').textContent = n + (n === 1 ? ' possible pick' : ' possible picks'); $('go').disabled = !n; }
let last = null;
function pick() {
  const p = pool(); if (!p.length) { $('out').innerHTML = '<div class="x-empty">Nothing matches that combination. Turn on another format or loosen a filter.</div>'; return; }
  let e; do { e = p[Math.floor(Math.random() * p.length)]; } while (p.length > 1 && e === last); last = e;
  const s = SECT[e.x];
  $('out').innerHTML = '<div class="x-result"><span class="x-stamp">Your pick</span>' +
    '<div class="x-rmeta">' + esc(e.k) + ' · ' + yr(e.y) + (e.c ? ' · ' + esc(e.c) : '') + '</div>' +
    '<h2>' + esc(e.t) + '</h2>' + (e.by ? '<p class="x-rby">' + esc(e.by) + '</p>' : '') +
    '<p class="x-rsum">' + esc(e.s) + '</p>' +
    (e.pl && e.pl.length ? '<div class="x-rpl">' + e.pl.map(n => '<span>' + esc(n) + '</span>').join('') + '</div>' : '') +
    (e.kw && e.kw.length ? '<p class="x-rkw">' + e.kw.map(esc).join(' · ') + '</p>' : '') +
    '<div class="x-ract"><button type="button" id="again">Pick another</button><a href="/' + s[0] + '/#id=' + encodeURIComponent(e.id) + '">Open in ' + s[1] + '</a>' +
    (e.url ? '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">Open source ↗</a>' : '') + '</div></div>';
}
document.addEventListener('click', ev => {
  const c = ev.target.closest('[data-m]');
  if (c && c.classList.contains('x-chip')) { const n = c.dataset.m; on.has(n) ? on.delete(n) : on.add(n); c.setAttribute('aria-pressed', on.has(n)); count(); return; }
  if (ev.target.closest('#again')) pick();
});
['era', 'kw', 'pl'].forEach(id => $(id).addEventListener('change', count));
$('go').addEventListener('click', pick);
$('only').addEventListener('click', () => { const b = document.querySelectorAll('.x-chip'); const all = on.size === MEDIA.length; on.clear(); if (!all) MEDIA.forEach(m => on.add(m[0])); b.forEach(x => x.setAttribute('aria-pressed', on.has(x.dataset.m))); count(); });
count();

});
</script>
</body>
</html>
